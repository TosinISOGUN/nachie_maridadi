<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- SEO tags will be dynamicly injected by React Helmet -->
    <link rel="icon" type="image/png" href="/nachie_maridadi_favicon.png" />

    <!-- Primary Meta Tags -->
    <title>Nachie Maridadi — Bespoke African Fashion</title>
    <meta name="description" content="Bespoke women's clothing, handcrafted in Nairobi with premium Ankara and curated fabrics — made uniquely for you." />
    <meta name="theme-color" content="#2C2420" />
    <meta name="robots" content="index, follow" />
    <meta name="google-site-verification" content="83CmNE_tw-tUNJaI-PsYOzUD9PEINI_kYFhS2Vv1DUQ" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nachiemaridadi.vercel.app/" />
    <meta property="og:title" content="Nachie Maridadi — Bespoke African Fashion" />
    <meta property="og:description" content="Bespoke women's clothing, handcrafted in Nairobi with premium Ankara and curated fabrics — made uniquely for you." />
    <meta property="og:image" content="https://nachiemaridadi.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Nachie Maridadi" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nachie Maridadi — Bespoke African Fashion" />
    <meta name="twitter:description" content="Bespoke women's clothing, handcrafted in Nairobi with premium Ankara and curated fabrics — made uniquely for you." />
    <meta name="twitter:image" content="https://nachiemaridadi.vercel.app/og-image.jpg" />

    <script type="application/ld+json">

      "@context": "https://schema.org",

      "name": "Nachie Maridadi",
      "description": "Bespoke women's fashion using premium Ankara and curated fabrics. Customized with love in Nairobi, Kenya.",
      "url": "https://nachiemaridadi.com",
      "telephone": "+254795680206",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Nairobi",
        "addressCountry": "KE"
      },
      "openingHours": ["Mo-Fr 09:00-18:00"],
      "priceRange": "$$",
      "sameAs": []
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
